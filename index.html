<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CURS3D Audio Portal</title>
  <style>
    :root {
      --bg: #090a10;
      --panel: #131520;
      --field: #1c1e2b;
      --border: #303348;
      --text: #f4f7ff;
      --muted: #91a0c0;
      --accent: #a855f7;
      --accent2: #38bdf8;
      --danger: #ff4545;
      --good: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(168, 85, 247, 0.18), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.12), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    main {
      width: min(680px, 100%);
    }

    .brand {
      margin-bottom: 24px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.4rem);
      line-height: 0.9;
      letter-spacing: 0;
    }

    .sub {
      color: var(--muted);
      margin: 10px 0 0;
      line-height: 1.5;
    }

    .badge {
      color: var(--accent2);
      border: 1px solid rgba(56, 189, 248, 0.38);
      padding: 7px 10px;
      font-size: 0.75rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .card {
      background: rgba(19, 21, 32, 0.92);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: clamp(20px, 4vw, 32px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .title {
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 0.16em;
      font-size: 0.8rem;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 0.82rem;
      text-transform: uppercase;
      margin: 0 0 9px;
    }

    input, select, button {
      width: 100%;
      min-height: 56px;
      border-radius: 8px;
      font: inherit;
    }

    input, select {
      background: var(--field);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0 16px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.16);
    }

    .field {
      margin-bottom: 20px;
    }

    button {
      border: 0;
      background: linear-gradient(135deg, #7c3aed, #b255ff);
      color: white;
      font-weight: 900;
      letter-spacing: 0.08em;
      cursor: pointer;
      text-transform: uppercase;
    }

    button:disabled {
      opacity: 0.58;
      cursor: wait;
    }

    .status {
      display: none;
      margin-top: 20px;
      border-radius: 8px;
      padding: 16px;
      line-height: 1.45;
    }

    .status.show { display: block; }
    .status.error {
      background: rgba(255, 69, 69, 0.12);
      border: 1px solid rgba(255, 69, 69, 0.42);
      color: var(--danger);
    }
    .status.loading {
      background: rgba(168, 85, 247, 0.11);
      border: 1px solid rgba(168, 85, 247, 0.36);
      color: #d8b4fe;
    }
    .status.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.34);
      color: var(--good);
    }

    .result {
      margin-top: 12px;
      padding: 12px;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #d8b4fe;
      word-break: break-all;
      font-family: Consolas, monospace;
      font-size: 0.86rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .actions button {
      min-height: 42px;
      background: var(--field);
      border: 1px solid var(--border);
      font-size: 0.82rem;
    }

    @media (max-width: 520px) {
      .brand {
        display: block;
      }

      .badge {
        display: inline-block;
        margin-top: 14px;
      }

      .actions {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="brand">
      <div>
        <h1>CURS3D<br />AUDIO</h1>
        <p class="sub">Paste a YouTube link. Convert it. Save the MP3 on this site.</p>
      </div>
      <div class="badge">v3 fixed</div>
    </section>

    <section class="card">
      <div class="title">Extract Audio</div>

      <div class="field">
        <label for="ytUrl">YouTube URL</label>
        <input id="ytUrl" type="url" placeholder="https://youtu.be/xB1VINVSFHY" autocomplete="off" />
      </div>

      <div class="field">
        <label for="quality">Audio Quality</label>
        <select id="quality">
          <option value="128">128 kbps - Standard</option>
          <option value="192" selected>192 kbps - High</option>
          <option value="320">320 kbps - Maximum</option>
        </select>
      </div>

      <button id="extractBtn" type="button">Extract MP3</button>

      <div id="loading" class="status loading">Converting. Leave this tab open.</div>
      <div id="error" class="status error"></div>
      <div id="success" class="status success">
        MP3 ready. Copy this direct link:
        <div id="resultUrl" class="result"></div>
        <div class="actions">
          <button id="copyBtn" type="button">Copy Link</button>
          <button id="downloadBtn" type="button">Download</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const ytUrl = document.getElementById('ytUrl');
    const quality = document.getElementById('quality');
    const extractBtn = document.getElementById('extractBtn');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const success = document.getElementById('success');
    const resultUrl = document.getElementById('resultUrl');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let lastUrl = '';

    function hideStatuses() {
      loading.classList.remove('show');
      error.classList.remove('show');
      success.classList.remove('show');
      error.textContent = '';
    }

    function showError(message) {
      hideStatuses();
      error.textContent = message;
      error.classList.add('show');
    }

    async function convert() {
      const url = ytUrl.value.trim();
      hideStatuses();

      if (!url) {
        showError('Paste a YouTube URL first.');
        return;
      }

      extractBtn.disabled = true;
      loading.classList.add('show');

      try {
        const response = await fetch('/convert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, quality: quality.value })
        });
        const data = await response.json();

        if (!response.ok || !data.url) {
          throw new Error(data.error || 'Conversion failed.');
        }

        lastUrl = data.url;
        resultUrl.textContent = data.url;
        hideStatuses();
        success.classList.add('show');
      } catch (err) {
        showError(err.message || 'Server error. Try again.');
      } finally {
        extractBtn.disabled = false;
      }
    }

    extractBtn.addEventListener('click', convert);
    ytUrl.addEventListener('keydown', event => {
      if (event.key === 'Enter') convert();
    });

    copyBtn.addEventListener('click', async () => {
      if (!lastUrl) return;
      await navigator.clipboard.writeText(lastUrl);
      copyBtn.textContent = 'Copied';
      setTimeout(() => {
        copyBtn.textContent = 'Copy Link';
      }, 1400);
    });

    downloadBtn.addEventListener('click', () => {
      if (!lastUrl) return;
      window.open(lastUrl, '_blank', 'noopener');
    });
  </script>
</body>
</html>
